-right-width:228px}.brand-copy span{display:none}.panel-block{padding-inline:14px}}@media (max-width:960px){.workspace,.workspace.functions-collapsed,.workspace.analysis-collapsed,.workspace.functions-collapsed.analysis-collapsed{grid-template-columns:minmax(0,1fr)}.panel{z-index:25;top:calc(var(--top-height) + env(safe-area-inset-top));bottom:calc(var(--bottom-height) + env(safe-area-inset-bottom));width:min(320px,86vw);position:fixed;box-shadow:0 10px 35px #17232129}.functions-panel{border-right:1px solid var(--line-strong);left:0}.analysis-panel{border-left:1px solid var(--line-strong);right:0}.functions-collapsed .functions-panel{opacity:0;pointer-events:none;transform:translate(-105%)}.analysis-collapsed .analysis-panel{opacity:0;pointer-events:none;transform:translate(105%)}.canvas-stage{grid-column:1}}@media (max-width:680px){:root{--top-height:58px}.topbar{padding-inline:max(9px, env(safe-area-inset-left));gap:8px}.brand{gap:8px}.brand-mark{flex-basis:34px;width:34px;height:34px}.brand-copy h1{font-size:16px}.action-btn{width:36px;min-width:36px;padding:0}.action-btn span{display:none}.tool-separator{margin-inline:2px}.icon-btn{width:34px}.canvas-badge{top:8px;left:8px}.floating-controls{bottom:9px;right:8px}.floating-btn{width:35px;height:34px}.status-runtime{display:none}}@media (pointer:coarse){.icon-btn{width:42px;height:42px}.action-btn{min-width:76px;height:42px;padding-inline:13px;font-size:12.5px}.mini-icon-btn{width:38px;height:38px}.function-item{min-height:54px}.function-select{padding-block:12px}.function-copy code{font-size:13.5px}.function-actions{opacity:1}.function-actions button{width:38px;height:38px}.function-actions svg{width:17px;height:17px}.expression-field{min-height:48px}.expression-field input{height:46px;font-size:15px}.math-keypad button{height:38px;font-size:12px}.color-swatch{width:22px;height:22px}.custom-color{width:32px;height:32px}.primary-btn,.secondary-btn{height:42px;padding-inline:16px;font-size:12.5px}.parameter-number{width:86px;height:36px;font-size:12px}.parameter-range{height:28px}.switch-row{min-height:42px}.switch-row i{width:38px;height:22px}.switch-row i:after{width:16px;height:16px}.switch-row input:checked+i:after{transform:translate(16px)}.floating-btn{width:44px;height:44px}.floating-btn svg{width:19px;height:19px}.example-grid button{height:38px;font-size:10.5px}}@media (prefers-reduced-motion:reduce){*,:before,:after{scroll-behavior:auto!important;transition-duration:.01ms!important;animation-duration:.01ms!important}}

  </head>
  <body>
    <div id="app" class="app-shell">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <i data-lucide="chart-spline"></i>
          </div>
          <div class="brand-copy">
            <h1>函数绘图</h1>
            <span>表达式 · 数值 · 图形</span>
          </div>
        </div>

        <div class="topbar-tools">
          <button
            id="toggle-functions-btn"
            class="icon-btn panel-toggle"
            type="button"
            title="显示或收起函数面板"
            aria-controls="functions-panel"
            aria-expanded="true"
          >
            <i data-lucide="panel-left-close"></i>
          </button>

          <span class="tool-separator"></span>

          <button id="save-btn" class="action-btn" type="button" title="保存函数文档">
            <i data-lucide="save"></i><span>保存</span>
          </button>
          <button id="open-btn" class="action-btn" type="button" title="打开函数文档">
            <i data-lucide="folder-open"></i><span>打开</span>
          </button>
          <button id="export-btn" class="action-btn" type="button" title="导出 PNG">
            <i data-lucide="image-down"></i><span>导出</span>
          </button>
          <input id="file-input" type="file" accept=".json,application/json" hidden />

          <span class="tool-separator"></span>

          <button
            id="toggle-analysis-btn"
            class="icon-btn panel-toggle"
            type="button"
            title="显示或收起分析面板"
            aria-controls="analysis-panel"
            aria-expanded="true"
          >
            <i data-lucide="panel-right-close"></i>
          </button>
        </div>
      </header>

      <main id="workspace" class="workspace">
        <aside id="functions-panel" class="panel functions-panel">
          <section class="panel-block function-block">
            <div class="section-heading">
              <div>
                <span class="section-kicker">FUNCTIONS</span>
                <h2>函数</h2>
              </div>
              <button id="new-function-btn" class="mini-icon-btn" type="button" title="新建函数">
                <i data-lucide="plus"></i>
              </button>
            </div>

            <div id="function-list" class="function-list" aria-live="polite"></div>
            <p id="function-empty" class="empty-state">尚未添加函数</p>
          </section>

          <section class="panel-block editor-block">
            <form id="function-form" autocomplete="off">
              <div class="expression-field">
                <span class="expression-prefix">y =</span>
                <input
                  id="expression-input"
                  type="text"
                  inputmode="text"
                  spellcheck="false"
                  autocapitalize="off"
                  placeholder="sin(x)"
                  aria-label="函数表达式"
                />
              </div>

              <div id="expression-error" class="expression-error" role="status" hidden></div>

              <div class="math-keypad number-keypad" aria-label="数字与运算符">
                <button type="button" data-snippet="7">7</button>
                <button type="button" data-snippet="8">8</button>
                <button type="button" data-snippet="9">9</button>
                <button type="button" data-snippet="/" class="operator-key">÷</button>
                <button type="button" data-snippet="4">4</button>
                <button type="button" data-snippet="5">5</button>
                <button type="button" data-snippet="6">6</button>
                <button type="button" data-snippet="*" class="operator-key">×</button>
                <button type="button" data-snippet="1">1</button>
                <button type="button" data-snippet="2">2</button>
                <button type="button" data-snippet="3">3</button>
                <button type="button" data-snippet="-" class="operator-key">−</button>
                <button type="button" data-snippet="0">0</button>
                <button type="button" data-snippet=".">.</button>
                <button type="button" data-snippet="+" class="operator-key">+</button>
                <button
                  type="button"
                  class="backspace-key"
                  data-input-action="backspace"
                  title="删除"
                  aria-label="删除一个字符"
                >
                  <i data-lucide="delete"></i>
                </button>
              </div>

              <div class="math-keypad" aria-label="数学符号">
                <button type="button" data-snippet="sin()" data-caret="-1">sin</button>
                <button type="button" data-snippet="cos()" data-caret="-1">cos</button>
                <button type="button" data-snippet="tan()" data-caret="-1">tan</button>
                <button type="button" data-snippet="sqrt()" data-caret="-1">√</button>
                <button type="button" data-snippet="abs()" data-caret="-1">abs</button>
                <button type="button" data-snippet="ln()" data-caret="-1">ln</button>
                <button type="button" data-snippet="exp()" data-caret="-1">e<sup>x</sup></button>
                <button type="button" data-snippet="^">x²</button>
                <button type="button" data-snippet="pi">π</button>
                <button type="button" data-snippet="x">x</button>
                <button type="button" data-snippet="(">(</button>
                <button type="button" data-snippet=")">)</button>
              </div>

              <div class="color-row">
                <span>颜色</span>
                <div id="color-swatches" class="color-swatches" aria-label="曲线颜色"></div>
                <label class="custom-color" title="自定义颜色">
                  <input id="color-input" type="color" value="#1f7a70" aria-label="自定义曲线颜色" />
                </label>
              </div>

              <div class="editor-actions">
                <button id="cancel-edit-btn" class="secondary-btn" type="button" hidden>
                  取消
                </button>
                <button id="submit-function-btn" class="primary-btn" type="submit">
                  <i data-lucide="plus"></i>
                  <span>添加函数</span>
                </button>
              </div>
            </form>
          </section>

          <section id="parameters-block" class="panel-block parameter-block" hidden>
            <div class="section-heading compact">
              <div>
                <span class="section-kicker">PARAMETERS</span>
                <h2>参数</h2>
              </div>
              <i data-lucide="sliders-horizontal" aria-hidden="true"></i>
            </div>
            <div id="parameter-list" class="parameter-list"></div>
          </section>
        </aside>

        <section id="canvas-stage" class="canvas-stage" aria-label="函数图形画布">
          <canvas id="graph-canvas"></canvas>
          <canvas id="interaction-canvas" class="interaction-canvas"></canvas>

          <button
            id="edge-functions-toggle"
            class="edge-panel-toggle"
            type="button"
            title="展开函数面板"
            aria-controls="functions-panel"
            aria-expanded="false"
          >
            <i data-lucide="panel-left-open"></i>
          </button>

          <div class="canvas-badge">
            <span id="zoom-value">100%</span>
            <span class="badge-divider"></span>
            <span id="canvas-resolution">0 × 0</span>
          </div>

          <div class="floating-controls" aria-label="视图控制">
            <button id="zoom-in-btn" class="floating-btn" type="button" title="放大">
              <i data-lucide="zoom-in"></i>
            </button>
            <button id="zoom-out-btn" class="floating-btn" type="button" title="缩小">
              <i data-lucide="zoom-out"></i>
            </button>
            <button id="fit-view-btn" class="floating-btn" type="button" title="适应函数图像">
              <i data-lucide="maximize-2"></i>
            </button>
            <button id="reset-view-btn" class="floating-btn" type="button" title="重置视图">
              <i data-lucide="rotate-ccw"></i>
            </button>
          </div>

          <div id="readout-card" class="readout-card" hidden>
            <span id="readout-swatch" class="readout-swatch"></span>
            <div class="readout-content">
              <strong id="readout-expression"></strong>
              <span id="readout-coordinate"></span>
            </div>
          </div>
        </section>

        <aside id="analysis-panel" class="panel analysis-panel">
          <section class="panel-block">
            <div class="section-heading compact">
              <div>
                <span class="section-kicker">VIEW</span>
                <h2>视图</h2>
              </div>
              <i data-lucide="grid-3x3" aria-hidden="true"></i>
            </div>

            <div class="view-ranges">
              <div><span>x</span><strong id="x-range-value">-8 … 8</strong></div>
              <div><span>y</span><strong id="y-range-value">-5 … 5</strong></div>
            </div>

            <div class="switch-list">
              <label class="switch-row">
                <span>网格</span>
                <input id="grid-toggle" type="checkbox" checked />
                <i aria-hidden="true"></i>
              </label>
              <label class="switch-row">
                <span>坐标轴</span>
                <input id="axes-toggle" type="checkbox" checked />
                <i aria-hidden="true"></i>
              </label>
              <label class="switch-row">
                <span>交点</span>
                <input id="intersections-toggle" type="checkbox" checked />
                <i aria-hidden="true"></i>
              </label>
            </div>
          </section>

          <section class="panel-block">
            <div class="section-heading compact">
              <div>
                <span class="section-kicker">READOUT</span>
                <h2>读数</h2>
              </div>
              <i data-lucide="crosshair" aria-hidden="true"></i>
            </div>
            <div id="analysis-empty" class="analysis-empty">点击曲线读取数值</div>
            <dl id="analysis-details" class="analysis-details" hidden>
              <div><dt>函数</dt><dd id="detail-expression"></dd></div>
              <div><dt>x</dt><dd id="detail-x"></dd></div>
              <div><dt>y</dt><dd id="detail-y"></dd></div>
              <div><dt>斜率</dt><dd id="detail-slope"></dd></div>
            </dl>
          </section>

          <section class="panel-block examples-block">
            <div class="section-heading compact">
              <div>
                <span class="section-kicker">EXAMPLES</span>
                <h2>常用函数</h2>
              </div>
            </div>
            <div class="example-grid">
              <button type="button" data-example="x^2-2">x² − 2</button>
              <button type="button" data-example="sin(x)">sin x</button>
              <button type="button" data-example="1/x">1 / x</button>
              <button type="button" data-example="sqrt(x)">sqrt x</button>
              <button type="button" data-example="abs(x)">abs x</button>
              <button type="button" data-example="a*x+b">a·x + b</button>
            </div>
          </section>
        </aside>
      </main>

      <footer class="statusbar">
        <div class="status-main">
          <span id="function-status">1 条函数</span>
          <span class="status-separator"></span>
          <span id="coordinate-status">x 0, y 0</span>
        </div>
        <div class="status-runtime">
          <span class="offline-dot"></span>
          本地离线运行
        </div>
      </footer>
    </div>

  </body>
</html>
